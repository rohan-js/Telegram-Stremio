# Docker resolv.conf for the containerized app.
# Public resolver: answers Atlas SRV lookups instantly from inside
# wgcf_kernel's shared network namespace. Docker's `dns:` option is
# incompatible with network_mode: service:wgcf_kernel, so this file is
# bind-mounted over /etc/resolv.conf instead (see docker-compose.yaml).
nameserver 1.1.1.1