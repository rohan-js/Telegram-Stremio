services:
  warp_proxy:
    build:
      context: ./deploy/wireproxy
    image: wireproxy:local
    container_name: warp_proxy
    volumes:
      - ./warp_private/wireproxy/config:/etc/wireproxy/config:ro
      - ./warp_private/wgcf/wgcf-profile.conf:/etc/wireproxy/wgcf-profile.conf:ro
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

  telegram-stremio:
    build: .
    image: telegram-stremio:local
    container_name: tg_stremio  
    depends_on:
      - warp_proxy
      - qbittorrent
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Pin DNS for Atlas SRV lookups via a bind-mounted resolv.conf: Docker's
    # `dns:` option is incompatible with network_mode: service:wgcf_kernel
    # (set by docker-compose.wgkernel.yml), and without a pin the container
    # inherits a resolver that 21s-timeouts or is unreachable (127.0.0.53 /
    # 169.254.169.254) from the shared netns. 1.1.1.1 resolves instantly.
    volumes:
      - ./deploy/resolv.conf:/etc/resolv.conf:ro
      - ./config.env:/app/config.env
      - ./cache:/app/cache
      - /mnt/stremio-downloads/torrents/completed:/downloads/completed:ro
      - /var/log/nginx:/host/var/log/nginx:ro
      - /sys/class/net/ens3/statistics/tx_bytes:/host/ens3_tx_bytes:ro
      - /proc/net:/host/proc/net:ro
    ports:
      - "8000:8000"
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 1536m
    # Reserve host CPU so sshd/systemd/watchdogs stay schedulable during app
    # boot storms: E2.1.Micro loses 40%+ of its slice to hypervisor steal
    # under load (2026-09-23 15:40 incident), and an uncapped app starved
    # the control plane into a full freeze on 09-15/09-23.
    cpus: "1.4"
    logging:
      driver: "json-file"
      options:
        max-size: "1m"     
        max-file: "3"

  qbittorrent:
    image: qbittorrentofficial/qbittorrent-nox:latest
    container_name: qbittorrent
    environment:
      - QBT_LEGAL_NOTICE=confirm
      - QBT_TORRENTING_PORT=6881
      - QBT_WEBUI_PORT=8080
      - PUID=1001
      - PGID=1001
      - UMASK=002
      - TZ=Asia/Kolkata
    ports:
      - "6881:6881/tcp"
      - "6881:6881/udp"
    volumes:
      - /mnt/stremio-downloads/torrents/qbit-config:/config
      - /mnt/stremio-downloads/torrents:/downloads
    restart: unless-stopped
    stop_grace_period: 30m
    tmpfs:
      - /tmp
    mem_limit: 384m
    memswap_limit: 768m
    # Hash-check/reseed bursts did 600MB+ of reads in 5 min and triggered the
    # 2026-09-23 15:40 reclaim storm; cap so qbit can never monopolize the
    # micro-shape slice.
    cpus: "0.8"
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"
