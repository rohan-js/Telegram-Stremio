name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q Backend tests

      - name: Run test suite
        # Import-time constructors need plausible dummies (never dialed/connected
        # in tests): Database() parses DATABASE URIs, pyrogram Clients build at
        # import from bot.py. Excludes the documented pre-existing failure in
        # test_stremio_configure (SessionMiddleware missing in its test scope).
        env:
          DATABASE: "mongodb://ci-dummy-tracker.local,mongodb://ci-dummy-storage.local"
          API_ID: "12345"
          API_HASH: "0123456789abcdef0123456789abcdef"
          BOT_TOKEN: "123456789:TEST-token-ci-only"
          HELPER_BOT_TOKEN: "123456789:TEST-helper-ci-only"
        run: |
          MODULES=$(ls tests/test_*.py | grep -v test_stremio_configure.py \
            | sed 's|^tests/|tests.|; s|\.py$||' | tr '\n' ' ')
          echo "Running: $MODULES"
          python -m unittest $MODULES

  build-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name (GHCR requires lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:main
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
